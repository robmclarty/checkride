id: no-logic-in-barrel
message: |
  index.ts is a barrel: re-export from named files
  (`export { thing } from './thing.js'`), don't define logic here. Move
  functions and classes into a named module file. A folder that would hold a
  single file doesn't need to be a folder.
severity: error
language: typescript
files:
  - '**/index.ts'
rule:
  any:
    - kind: function_declaration
    - kind: class_declaration
    - kind: abstract_class_declaration

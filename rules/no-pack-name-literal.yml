id: no-pack-name-literal
message: |
  The orchestrator and the launcher never branch on a pack's name: don't
  spell 'ts', 'go', 'rust', 'bash', 'python' or 'terraform' here. Read what
  differs between packs from the pack's own data (its pins, env and adapter
  rows in src/packs/), so a new pack is a new row, not a new branch.
severity: error
language: typescript
files:
  - src/orchestrator/**/*.ts
  - src/launch/**/*.ts
ignores:
  - '**/__tests__/**'
rule:
  kind: string_fragment
  regex: "^(ts|go|rust|bash|python|terraform)$"

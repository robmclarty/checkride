# Fallow: dead code, circular deps, duplication, complexity, architecture boundaries.
# Docs: https://docs.fallow.tools

# The bundled Claude Code plugin's readers are invoked as
# `node dist/triage/cli.js` and `node dist/qa/cli.js` from a skill,
# never imported by src/index.ts or src/cli.ts — so each executable entry
# module is declared here or `dead` flags it as an unused file.
entry = [
  "src/index.ts",
  "src/cli.ts",
  "src/triage/cli.ts",
  "src/qa/cli.ts",
  "src/**/*.test.ts",
  "test/**/*.test.ts",
  "stryker.config.mjs",
]

# The static site (GitHub Pages): support.js is a generated runtime bundle and
# the pages are standalone HTML — front-end assets, not package source.
#
# examples/: standalone demo packages, each installed and run on its own by
# test/e2e/examples.e2e.test.ts. Their files are unreachable from this package's
# entry points by design (and some are deliberately broken), so dead-code
# analysis of them from here would be noise.
ignorePatterns = ["site/**", "examples/**"]

# CLI/tooling deps used via command line or config files, not imported from source.
ignoreDependencies = [
  "@ast-grep/cli",
  "@stryker-mutator/vitest-runner",
  "@arethetypeswrong/cli",
  "@vvago/vale",
  "publint",
]

[rules]
unused-exports = "error"
unused-files = "error"
unused-dependencies = "error"
circular-dependencies = "error"
boundary-violation = "error"

[duplicates]
# mild (default): AST-based, catches copy-paste. semantic: catches renamed variables too.
mode = "mild"
minTokens = 50

[health]
# Per-function complexity thresholds. Tune to project.
maxCyclomatic = 15
maxCognitive = 15

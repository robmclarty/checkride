name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push to a PR supersedes its in-flight run; pushes to
# main queue instead of cancelling, so every landed commit gets a full verdict.
# Nothing here writes to the repo: the checkout reads it, and the e2e step's
# token only identifies the job to GitHub's API. Artifact upload and the
# dependency cache go through their own service, not this token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check + e2e (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tested envelope (README "Tested envelope", docs/contract.md):
        # macOS + Linux, at the exact supported floor (engines.node 22.18.0)
        # and the two newest majors. Windows waits for a consumer who needs it.
        os: [ubuntu-latest, macos-latest]
        node: ['22.18.0', '24', '26']
    # One job of the six writes the step summary, or the run's page would carry
    # six tables (docs/ci.md, "The verdict on the run's page"). It needs the
    # history back to the base it counts baseline keys against.
    env:
      SUMMARY_JOB: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.SUMMARY_JOB == 'true' && '0' || '1' }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The e2e package-manager quartet exercises pnpm, npm, yarn, and bun.
      # npm and yarn ship on the hosted images; bun needs a setup step.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full pipeline (types, lint, struct, dead, dupes, health, test+coverage,
      # docs, links, spell, publint, attw, typecheck-tests) — checkride running on
      # itself. Mutation is opt-in (`pnpm mutation`), not in the default gate: a
      # cold run has no warm stryker.incremental.json cache and would time out.
      #
      # CHECKRIDE_ANNOTATE: each finding of a red check also lands on the pull
      # request's diff and in the job's annotation list (docs/ci.md).
      #
      # CHECKRIDE_SUMMARY, in the one summary job: the verdict as a table on
      # the run's page, its baseline keys counted against CHECKRIDE_BASE, the
      # pull request's base or, on a push, the commit before it (on a push
      # origin/main is the commit being checked, so it would count nothing).
      # An empty CHECKRIDE_SUMMARY counts as unset in the other five.
      - name: pnpm check
        run: pnpm check
        env:
          CHECKRIDE_ANNOTATE: github
          CHECKRIDE_SUMMARY: ${{ env.SUMMARY_JOB == 'true' && 'github' || '' }}
          CHECKRIDE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      # A failing slot prints a bounded excerpt beneath its status line: five
      # findings, or its last eight lines. That names what broke, but a test
      # run's failure is often longer than eight lines, and the rest lives in
      # `.check/`, which a hosted runner discards. This puts the whole of each
      # failing slot's output in the log, folded, so a red CI run can be read
      # without downloading the artifact below.
      - name: Failing check output
        if: failure()
        run: |
          [ -d .check ] || exit 0
          failed=$(node -e '
            const s = require("./.check/summary.json");
            console.log(s.checks.filter(c => c.ok === false).map(c => c.name).join(" "));
          ' 2>/dev/null) || failed=""
          echo "failing slots: ${failed:-<none recorded>}"
          for slot in $failed; do
            for f in ".check/$slot.stdout.txt" ".check/$slot.stderr.txt"; do
              [ -s "$f" ] || continue
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            done
          done

      # Keep the whole report so an intermittent, platform-specific failure can
      # be read after the fact rather than reproduced by guesswork. Coverage is
      # excluded: it is large and never the thing being diagnosed.
      - name: Upload check report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .check/
            !.check/coverage/
          retention-days: 14
          if-no-files-found: ignore

      # Every pack's toolchain at the version the root mise.toml pins. Installed
      # after `pnpm check` so this repo's own run sees the same PATH as before;
      # the action exports the install paths, so the CLI under test finds the
      # tools from the temp copies the e2e cases run in.
      #
      # No shims: a shim picks its tool from the cwd's mise.toml, and those
      # temp copies have none. The cargo shim there drops the install paths
      # from PATH, so `cargo nextest` finds only the cargo-nextest shim, which
      # fails. The install paths alone put every tool on PATH.
      - name: Install e2e toolchains
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          add_shims_to_path: false

      # The green-out-of-the-box invariant: generate each shape, install it, and
      # run the built CLI against it (the predecessor's encoded lesson) — plus
      # the PM quartet and the interrupted-run (never-torn artifacts) cases.
      # CHECKRIDE_REQUIRE_TOOLCHAINS turns a pack's missing tool from a local
      # skip into a failure (test/helpers/toolchains.ts).
      #
      # GITHUB_TOKEN: the mise route case (test/e2e/binary.e2e.test.ts)
      # installs a released binary through mise's `github:` backend, which
      # lists the release's assets through GitHub's API. Anonymous, that is 60
      # requests an hour per IP, shared across a hosted runner's neighbours;
      # the job's own token lifts it, and `permissions` above keeps it
      # read-only, since every process the suite spawns inherits it.
      - name: pnpm test:e2e
        run: pnpm test:e2e
        env:
          CHECKRIDE_REQUIRE_TOOLCHAINS: '1'
          GITHUB_TOKEN: ${{ github.token }}

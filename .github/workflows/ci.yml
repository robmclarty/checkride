name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push to a PR supersedes its in-flight run; pushes to
# main queue instead of cancelling, so every landed commit gets a full verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check + e2e (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tested envelope (README "Tested envelope", docs/contract.md):
        # macOS + Linux, at the exact supported floor (engines.node 22.18.0)
        # and the current major. Windows waits for a consumer who needs it.
        os: [ubuntu-latest, macos-latest]
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The e2e package-manager quartet exercises pnpm, npm, yarn, and bun.
      # npm and yarn ship on the hosted images; bun needs a setup step.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full pipeline (types, lint, struct, dead, dupes, health, test+coverage,
      # docs, links, spell, publint, attw, typecheck-tests) — checkride running on
      # itself. Mutation is opt-in (`pnpm mutation`), not in the default gate: a
      # cold run has no warm stryker.incremental.json cache and would time out.
      - name: pnpm check
        run: pnpm check

      # A failing slot prints only its status line: with no baseline file there
      # are no per-finding keys to report, so the captured output that says
      # *what* broke lives solely in `.check/` — which a hosted runner discards.
      # Without this, a red CI run is undiagnosable from the log alone.
      - name: Failing check output
        if: failure()
        run: |
          [ -d .check ] || exit 0
          failed=$(node -e '
            const s = require("./.check/summary.json");
            console.log(s.checks.filter(c => c.ok === false).map(c => c.name).join(" "));
          ' 2>/dev/null) || failed=""
          echo "failing slots: ${failed:-<none recorded>}"
          for slot in $failed; do
            for f in ".check/$slot.stdout.txt" ".check/$slot.stderr.txt"; do
              [ -s "$f" ] || continue
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            done
          done

      # Keep the whole report so an intermittent, platform-specific failure can
      # be read after the fact rather than reproduced by guesswork. Coverage is
      # excluded: it is large and never the thing being diagnosed.
      - name: Upload check report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .check/
            !.check/coverage/
          retention-days: 14
          if-no-files-found: ignore

      # The green-out-of-the-box invariant: generate each shape, install it, and
      # run the built CLI against it (the predecessor's encoded lesson) — plus
      # the PM quartet and the interrupted-run (never-torn artifacts) cases.
      - name: pnpm test:e2e
        run: pnpm test:e2e

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full pipeline (types, lint, struct, dead, test+coverage, docs, links,
      # spell, typecheck-tests) — checkride running on itself.
      - name: pnpm check
        run: pnpm check

      # The green-out-of-the-box invariant: generate each shape, install it, and
      # run the built CLI against it (the predecessor's encoded lesson).
      - name: pnpm test:e2e
        run: pnpm test:e2e

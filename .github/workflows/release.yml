name: Release

# Publishes to npm with provenance when a vX.Y.Z tag is pushed (the last step
# of the release ritual in CONTRIBUTING.md). Provenance links the published
# tarball to this exact commit and workflow run — verifiable on npmjs.com.
#
# Auth is npm Trusted Publishing (OIDC): no token exists anywhere — npm trusts
# this workflow's identity directly, so there is no secret to leak or rotate
# and no 2FA bypass. One-time setup on npmjs.com: package settings ->
# Trusted Publisher -> GitHub Actions, repository robmclarty/checkride,
# workflow filename release.yml.

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read
  id-token: write # required for npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      # No registry-url here: setup-node would write an .npmrc keyed to a
      # NODE_AUTH_TOKEN env var, which shadows the tokenless OIDC flow.
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1; pin the major to be sure.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate, then the slow suite — a release must be green on both.
      - name: pnpm check
        run: pnpm check

      - name: pnpm test:e2e
        run: pnpm test:e2e

      # npm (not pnpm) publish: Trusted Publishing + provenance are npm CLI
      # flows. prepublishOnly (tsc --build && vitest run) runs as a safety net.
      - name: Publish with provenance
        run: npm publish --provenance --access public

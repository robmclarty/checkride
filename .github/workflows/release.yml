name: Release

# Publishes to npm with provenance when a vX.Y.Z tag is pushed (the last step
# of the release ritual in CONTRIBUTING.md). Provenance links the published
# tarball to this exact commit and workflow run — verifiable on npmjs.com.
#
# Auth is npm Trusted Publishing (OIDC): no token exists anywhere — npm trusts
# this workflow's identity directly, so there is no secret to leak or rotate
# and no 2FA bypass. One-time setup on npmjs.com: package settings ->
# Trusted Publisher -> GitHub Actions, repository robmclarty/checkride,
# workflow filename release.yml.

on:
  push:
    tags: ['v[0-9]*']
  # Manual re-run hatch: a tag is immutable, so a publish that failed for a
  # reason outside the tree (auth, registry) can be retried from main — the
  # tarball contents are identical; npm refuses an already-published version.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Fail fast when the tag and package.json disagree — a mistagged push
      # would otherwise publish a version whose tag points at the wrong code.
      # On workflow_dispatch (the manual re-run hatch) there is no pushed tag:
      # instead require that v<version> exists on origin and points at HEAD,
      # so a retry can only republish exactly what the tag froze.
      - name: Verify tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::pushed tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
          else
            if ! git fetch --force --depth=1 origin "refs/tags/$version:refs/tags/$version"; then
              echo "::error::tag $version not found on origin"
              exit 1
            fi
            if [ "$(git rev-parse "$version^{}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::tag $version does not point at HEAD"
              exit 1
            fi
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      # No registry-url here: setup-node would write an .npmrc keyed to a
      # NODE_AUTH_TOKEN env var, which shadows the tokenless OIDC flow.
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1; pin the major to be sure.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate, then the slow suite — a release must be green on both.
      - name: pnpm check
        run: pnpm check

      - name: pnpm test:e2e
        run: pnpm test:e2e

      # npm (not pnpm) publish: Trusted Publishing + provenance are npm CLI
      # flows. prepublishOnly (tsc --build && vitest run) runs as a safety net.
      - name: Publish with provenance
        run: npm publish --provenance --access public

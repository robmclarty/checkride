name: Publish

# Publishes checkride to npm with provenance when a vX.Y.Z tag is pushed. Auth is
# npm Trusted Publishing (OIDC): no token exists anywhere - the registry trusts
# this exact workflow's identity, minted per run, so there is no secret to leak
# or rotate and no 2FA bypass. Provenance links the published tarball to this
# commit and workflow run, verifiable on npmjs.com and via `npm audit
# signatures`.
#
# Two jobs, so the OIDC identity never shares a job with the repo's
# dependencies. `build` installs them, runs the gate and the e2e suite, and
# packs the tarball, with no way to mint a token. `publish` holds id-token:
# write and the approval gate, and runs nothing from the repo: it downloads
# that tarball and publishes it as it is, with scripts off. A compromised dev
# dependency can still fail the build, but it can't publish with this
# workflow's identity.
#
# One-time setup outside the repo (both are required for the first run):
#   - npmjs.com: package checkride -> Settings -> Trusted Publisher ->
#     GitHub Actions, repository robmclarty/checkride, workflow filename
#     publish.yaml, environment npm-publish.
#   - GitHub: repo Settings -> Environments -> npm-publish, with a required
#     reviewer (yourself). The run pauses there until a maintainer approves -
#     the CI equivalent of the local MFA prompt this replaces.
#
# release.yaml (the GitHub Release for the same tag) stays a separate workflow
# so its `contents: write` never shares a job with `id-token: write`.

on:
  push:
    tags: ['v[0-9]*']
  # Manual re-run hatch: a tag is immutable, so a publish that failed for a
  # reason outside the tree (auth, registry) can be retried from the Actions tab
  # - the tarball contents are identical, and npm refuses an already-published
  # version. The version guard below re-checks that HEAD still matches the tag.
  workflow_dispatch:

permissions:
  contents: read # checkout only; the publish job swaps this for id-token alone

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail fast when the tag and package.json disagree - a mistagged push
      # would otherwise publish a version whose tag points at the wrong code.
      # On workflow_dispatch (the manual re-run hatch) there is no pushed tag:
      # instead require that v<version> exists on origin and points at HEAD, so
      # a retry can only republish exactly what the tag froze.
      - name: Verify tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::pushed tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
          else
            if ! git fetch --force --depth=1 origin "refs/tags/$version:refs/tags/$version"; then
              echo "::error::tag $version not found on origin"
              exit 1
            fi
            if [ "$(git rev-parse "$version^{}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::tag $version does not point at HEAD"
              exit 1
            fi
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      # No pnpm cache here: a cache can be written by other runs, and what this
      # job packs is what gets published.
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate, then the slow suite - a release must be green on both.
      - name: pnpm check
        run: pnpm check

      # Every pack's toolchain at the version the root mise.toml pins, as in
      # ci.yml, so a release proves each pack's e2e cases rather than skipping
      # them where a tool is missing. Installed after `pnpm check` so this
      # repo's own run sees the same PATH as before. No shims, for the reason
      # ci.yml gives.
      - name: Install e2e toolchains
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          add_shims_to_path: false

      - name: pnpm test:e2e
        run: pnpm test:e2e
        env:
          CHECKRIDE_REQUIRE_TOOLCHAINS: '1'

      # npm pack doesn't run prepublishOnly, so build here: the tarball ships
      # the dist/ this step writes, and the gate above already ran the tests.
      - name: Build
        run: pnpm build

      - name: Pack
        id: pack
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tarball="$name-$version.tgz"
          npm pack
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish # required-reviewer gate: the human approval step
    permissions:
      id-token: write # OIDC identity for npm trusted publishing + provenance
    steps:
      # No registry-url here: setup-node would write an .npmrc keyed to a
      # NODE_AUTH_TOKEN env var, which shadows the tokenless OIDC flow.
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Trusted Publishing needs npm >= 11.5.1; pin the major to be sure.
      - name: Update npm
        run: npm install -g npm@11 --ignore-scripts

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # npm (not pnpm) publish: the OIDC token exchange is an npm CLI flow.
      # --ignore-scripts: the build job already built and tested this tarball,
      # so prepublishOnly has nothing left to do here. --provenance is
      # redundant under trusted publishing but documents intent and fails
      # closed if the OIDC identity is ever absent.
      - name: Publish with provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public --ignore-scripts

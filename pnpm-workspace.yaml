# Single-package (flat) repo: no `packages:` globs, so this defines no workspace
# members. It exists only to approve the native build scripts of the tools that
# ship platform binaries, which pnpm 11 blocks by default.
allowBuilds:
  '@ast-grep/cli': true
  '@vvago/vale': true
  fallow: true

# Force patched versions of transitive dev dependencies flagged by `pnpm audit`.
# This package declares no runtime `dependencies` at all, so every entry here is
# dev-only and none reach the shipped tarball. Each is scoped to its advisory's
# vulnerable range so only the affected instances are rewritten, and capped to
# the major the parent expects rather than jumping to a new major.
#
# Re-check these on every dependency bump — an entry goes stale in either
# direction, and both have bitten:
#
#   - An advisory's range widens past a pin that used to clear it. `<5.0.7` no
#     longer covered brace-expansion, then `<5.0.8` did not either.
#   - A parent catches up and the entry retires. An override whose replacement
#     the parent's own range already permits fixes nothing; all it does is hold
#     a stale lockfile entry in place, so `pnpm audit` keeps flagging a package
#     that would resolve patched if simply re-resolved.
#
# The second is the one that reads as still-working, so the check is empirical:
# delete the entry, re-resolve, re-run `pnpm audit`. Reading the ranges is not
# enough. Retired that way so far: markdown-it and js-yaml (markdownlint-cli2
# 0.23.2 resolves patched versions itself), fast-uri and brace-expansion (ajv's
# and minimatch's own ranges reach 3.1.8 / 5.0.12), postcss (vite reaches 8.5.23).
# Those retirements still hold: on 2026-10-08, advisories against fast-uri 3.1.7,
# brace-expansion 5.0.9 and source-map-js 1.2.1 each cleared with a plain
# re-resolve (`pnpm update <name>`), no entry needed.
overrides:
  # Re-scoped 2026-09-04: GHSA-q8mj-m7cp-5q26 was cleared by ^6.15.2, then two
  # newer advisories moved the patched line to 6.16.0 and left 6.15.3 exposed —
  # inside the old '<6.15.2' match range's blind spot. Removing the entry drops
  # qs to 6.15.1 and three moderates return, so it is load-bearing, not stale
  # (re-checked 2026-10-08).
  'qs@>=2.2.5 <6.16.0': '^6.16.0' # GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx (moderate), via typed-rest-client
  # Re-scoped 2026-10-08: markdownlint-cli2 0.23.3 (its latest) pins smol-toml
  # at exactly 1.8.0, which a newer advisory covers, so no re-resolve can reach
  # the patched line on its own. cspell's range already resolves 1.9.0, and this
  # dedupes onto it. (First added 2026-09-16 for 0.23.2's exact 1.7.0 pin.)
  'smol-toml@<1.8.1': '^1.8.1' # GHSA-r4xh-jqrq-34v2 (moderate), GHSA-7w5x-hrqm-74c2 (high), via markdownlint-cli2

# Patched dependencies: fixes upstream hasn't shipped yet.
# Each entry names the issue it carries and how to tell it's done.
#
# @stryker-mutator/vitest-runner 10.0.0 builds its per-test filter by joining
# describe and test names with ' ', but Vitest 5 joins them with ' > '. The
# filter then matches nothing, every mutant run executes zero tests, and every
# covered mutant "survives", with no error. That's stryker-js #6210; the patch
# is the separator change from PR #6214, in the two built files that hold a copy
# of collectTestName. Measured 2026-10-08 on src/orchestrator/context.ts: 0%
# unpatched on Vitest 5, 84.85% patched, 84.85% on Vitest 4.
#
# Retire it when a release carries the fix: delete the entry and the patch file,
# re-install, and run the mutation canary (test/e2e/mutation-canary.e2e.test.ts,
# part of `pnpm test:e2e`). If it passes, the release fixed it; if it reports
# that no mutant was killed, it didn't. AGENTS.md, "Patched dependencies", has
# the full steps.
#
# @vvago/vale 3.24.0's postinstall downloads vale through GitHub's REST API
# (api.github.com/.../releases/assets/<id>) with no token and no way to pass
# one, so it draws on the API's anonymous limit: 60 requests an hour per IP,
# which hosted CI runners share between jobs. On 2026-10-08, CI's macOS /
# Node 26 job failed its install with "Download failed with status code: 403"
# three times running, the last more than an hour after the first two, while
# the macOS jobs on Node 22 and 24 fetched the same file, as did a Mac on the
# same Node 26. Why the API refused only that job is unknown. The patch swaps
# the six 3.24.0 URLs for the release's github.com download links: the same
# files, outside the API's limit, still checked against the pinned sha256.
# Patched, that job installed cleanly while an unpatched re-run 25 minutes
# later still got the 403, and both paths end at the same file host, which
# points the refusal at the API. Not yet reported upstream (zeropaper/vale).
#
# Retire it when a release stops downloading through api.github.com: after a
# bump, grep the new dist/index.cjs for it. If it's still there, re-create the
# patch with the new version's links, each asset's browser_download_url in
#   gh api repos/vale-cli/vale/releases/tags/v<version>
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
  '@vvago/vale@3.24.0': patches/@vvago__vale@3.24.0.patch

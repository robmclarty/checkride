# mypy: the `types` slot. It checks the bodies of functions with no
# annotations too, and flags ignores and casts that no longer do anything.
# Raise it to `strict = True` once the code is annotated.
[mypy]
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True
exclude = (^|/)test/fixtures/

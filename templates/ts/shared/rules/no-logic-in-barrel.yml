id: no-logic-in-barrel
message: |
  index.ts is a barrel: re-export from named files
  (`export { thing } from './thing.js'`) and define no logic here. Move
  functions and values into a named module file.
severity: error
language: typescript
files:
  - '**/src/**/index.ts'
ignores:
  - '**/test/fixtures/**'
rule:
  any:
    - kind: function_declaration
    - kind: class_declaration
    - kind: abstract_class_declaration
    - all:
        - kind: lexical_declaration
        - inside:
            kind: program
    - all:
        - kind: export_statement
        - has:
            kind: lexical_declaration

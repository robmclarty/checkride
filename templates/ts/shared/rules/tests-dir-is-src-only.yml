id: tests-dir-is-src-only
message: |
  `__tests__/` folders hold colocated unit tests and live only under `src/`.
  Outside `src/`, tests go in `test/integration/`, `test/e2e/` or
  `test/contract/`, and shared test code goes in `test/helpers/`.
note: |
  A location rule, like `colocate-unit-tests`: `files` and `ignores` alone
  decide what fires. `dist/` is ignored because tsc emits each test's
  `.d.ts` there, and ast-grep reads `.gitignore` only inside a git repo.
severity: error
language: typescript
files:
  - '**/__tests__/**/*.ts'
ignores:
  - '**/src/**'
  - '**/dist/**'
  - '**/test/fixtures/**'
rule:
  kind: program

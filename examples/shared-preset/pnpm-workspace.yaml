# This example is a standalone project, not a member of the checkride repo's
# workspace. Without this file, pnpm would walk up to the repo root, find its
# `pnpm-workspace.yaml`, and install *that* project instead — leaving this
# directory with no `node_modules` and no obvious sign anything went wrong.
#
# Its presence stops the walk here, so `pnpm install` in this directory does
# what it looks like it does. Every example carries one for the same reason.
#
# `preset/` is linked as an ordinary file dependency rather than declared a
# workspace member: in a real fleet it is a published package, and linking keeps
# the resolution path identical to the published one.

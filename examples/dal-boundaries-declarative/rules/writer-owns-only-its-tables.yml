id: writer-owns-only-its-tables
message: |
  A domain's writer may import only its own schema — `'./schema.js'`. Reaching
  for `'../<other>/schema.js'` means writing tables another domain owns.

  This works because the path convention already encodes ownership: your own
  schema is the one you reach without leaving the directory. One rule covers
  every domain, including the ones added after it was written.
severity: error
language: typescript
files:
  - src/domains/*/writer.ts
rule:
  all:
    - kind: import_statement
    - regex: "from\\s+['\"][^'\"]*schema\\.js['\"]"
    - not:
        regex: "from\\s+['\"]\\./schema\\.js['\"]"
